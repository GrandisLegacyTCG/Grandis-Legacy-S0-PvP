name: Grandis Legacy PvP Season 0 - public deployment checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PVP_REQUIRE_WS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production Node dependencies (PvP native ws transport)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build deterministic static compression
        run: npm run build:precompress
      - name: Run public smoke and integrity checks
        run: npm run check
      - name: Verify Docker image can build
        run: docker build --pull -t grandis-legacy-pvp-s0:ci .
      - name: Verify native ws transport in Docker
        run: |
          trap 'docker rm -f gl-pvp-qa >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --name gl-pvp-qa -e PVP_ALLOWED_ORIGINS=https://grandislegacytcg.web.id -p 3066:3000 grandis-legacy-pvp-s0:ci
          # Read the paired frontend build instead of hardcoding a previous release.
          node scripts/verify-docker-health.mjs
          GL_PVP_BACKEND_URL=http://127.0.0.1:3066 npm run smoke:northflank
          docker stop gl-pvp-qa
